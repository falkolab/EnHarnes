name: Nightly Entropy Check

on:
  schedule:
    - cron: '0 3 * * *'  # 03:00 UTC daily
  workflow_dispatch:

jobs:
  entropy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Through the Makefile, not a script path: the path is the part that moves.
      # This step named scripts/harness/entropy/entropy_check.py long after the
      # linters moved into .claude/skills/harness.linters/, and failed every night
      # on "No such file" rather than on anything the check looks for.
      - name: Run entropy check
        run: make check-entropy
